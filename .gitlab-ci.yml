# ==========================
# GLOBAL SETTINGS
# ==========================

variables:
  SIMPLEIPTV_VERSION: "1.0.1"
  GIT_SUBMODULE_STRATEGY: recursive

workflow:
  rules:
    # Never run pipelines for tags pushed by the bump script
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

stages:
  - version
  - build
  - publish


# ==========================
# 1) VERSION BUMP JOB
# ==========================

bump-version:
  stage: version
  tags: [linux]
  only:
    - master
  script:
    - scripts/bump_version.sh
    - echo "Version bumped to: $(cat version.txt)"
  artifacts:
    expire_in: 2 hours
    paths:
      - version.txt


# ==========================
# 2) PARALLEL BUILD JOBS
# ==========================

build-linux:
  stage: build
  tags: [linux]
  only:
    - master
  needs:
    - job: bump-version
      artifacts: true
  script:
    - echo "Building Linux artifacts..."
    - scripts/build_linux.sh
    - echo "Build complete."
  artifacts:
    expire_in: 6 hours
    paths:
      - packages/

build-windows:
  stage: build
  tags: [windows]
  only:
    - master
  needs:
    - job: bump-version
      artifacts: true
  script:
    - echo "Building Windows artifacts..."
    - scripts/build_windows.ps1
  artifacts:
    expire_in: 6 hours
    paths:
      - packages/


# ==========================
# 3) PUBLISH JOB
# ==========================

publish:
  stage: publish
  tags: [linux]
  only:
    - master
  needs:
    - job: bump-version
      artifacts: true
    - job: build-linux
      artifacts: true
    - job: build-windows
      artifacts: true

  script: |
    set -x

    VERSION=$(cat version.txt)
    echo "Publishing SimpleIPTV version $VERSION..."

    for f in packages/*; do
      if [ -f "$f" ]; then
        filename=$(basename "$f")
        full_path=$(realpath "$f")

        echo "Uploading: $filename"

        curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$full_path" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/simpleiptv/${VERSION}/${filename}"

      fi
    done

    echo "Publish complete!"

